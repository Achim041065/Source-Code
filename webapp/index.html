<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width", 
            initial-scale="1.0">
        <title>Beispielanwendung - erstmal </title>

        <script id="sap-ui-bootstrap"
                src="https://sapui5.hana.ondemand.com/sap-ui-core.js"
                data-sap-ui-theme="sap_horizon"
                data-sap-ui-libs="sap.m"
                data-sap-ui-resourceroots='{"de.sapui5buch.demo":"./"}'
                >

            </script>
            <script>
                sap.ui.require(["sap/ui/core/mvc/View"], function(View){
                    View.create({
                        viewName: "de.sapui5buch.demo.view.App",
                        type: sap.ui.core.mvc.ViewType.XML
                    }).then(function(oView){
                        oView.placeAt("body");
                    });
            })                
            </script>
</head>
    <body id="body">

    </body>
</html>
